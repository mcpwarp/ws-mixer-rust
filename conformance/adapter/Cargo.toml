[package]
name = "ws-mixer-conformance-adapter"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
description = "ws-mixer conformance runner adapter for ws-mixer-rust (client role)"
publish = false

[[bin]]
name = "conformance-adapter"
path = "src/main.rs"

[dependencies]
data-encoding = "2"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
ws-mixer = { path = "../..", features = ["conformance"] }
