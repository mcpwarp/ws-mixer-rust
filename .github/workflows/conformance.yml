name: conformance

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  GOTOOLCHAIN: auto

jobs:
  fixture-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: make fetch-spec
      - run: make adapter
      # The runner turns a missing or crashing adapter into all-SKIP and exits
      # 0, so fail here if the adapter does not come up.
      - name: smoke (adapter prints ready)
        run: make smoke
      - name: run conformance runner (rust, fixture mode)
        shell: bash
        run: |
          mkdir -p build
          { make conformance-fixture 2>&1 1>&3 | tee build/conformance-fixture.stderr; } 3>&1
      # The runner skips the floor check (and exits 0) for a key whose rows
      # are all SKIP. That is only acceptable while the floor is still 0.
      - name: guard (rust-client floor not skipped)
        shell: bash
        run: |
          floor=$(jq -er '.floors["rust-client"]' conformance/COUNTS.json)
          if grep -qF 'floor not checked for fully-skipped keys' build/conformance-fixture.stderr \
            && grep -qF '  rust-client: ' build/conformance-fixture.stderr \
            && [ "$floor" -gt 0 ]; then
            echo "rust-client rows were all SKIP but its floor is $floor" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-fixture
          path: build/*.xml
          if-no-files-found: warn

  pair-go-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: make fetch-spec
      - run: make fetch-goserver
      - run: make adapter
      - name: smoke (adapter prints ready)
        run: make smoke
      # ws-mixer-go at goserver.pin, built with -tags conformance.
      - run: make go-adapter
      # --sdk go,rust runs both go->go and go->rust, so a go->go FAIL also
      # fails this job. The go->rust floor in conformance/COUNTS.json is
      # enforced by the runner.
      - name: run conformance runner (go server x rust client, pair mode)
        shell: bash
        run: |
          mkdir -p build
          { make conformance-pair 2>&1 1>&3 | tee build/conformance-pair.stderr; } 3>&1
      - name: guard (go->rust floor not skipped)
        shell: bash
        run: |
          floor=$(jq -er '.floors["go->rust"]' conformance/COUNTS.json)
          if grep -qF 'floor not checked for fully-skipped keys' build/conformance-pair.stderr \
            && grep -qF '  go->rust: ' build/conformance-pair.stderr \
            && [ "$floor" -gt 0 ]; then
            echo "go->rust rows were all SKIP but its floor is $floor" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-pair
          path: build/*.xml
          if-no-files-found: warn

  # ws-mixer-mcpwarp's runners for spec/fixtures/mcpwarp, against the
  # ws-mixer-spec tag in spec.pin (make fetch-spec, run by the target).
  mcpwarp-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: run mcpwarp fixture runners (with test-util)
        shell: bash
        run: |
          mkdir -p build
          make mcpwarp-fixtures 2>&1 | tee build/mcpwarp-fixtures.log
      # The runners assert their own minimums; this also fails a run where the
      # tunnel runner was compiled without test-util and only printed
      # "skipped", or where a count line is missing.
      - name: guard (mcpwarp floors)
        shell: bash
        run: |
          log=build/mcpwarp-fixtures.log
          fail() { echo "$1" >&2; exit 1; }
          if grep -qF 'tunnel: skipped' "$log"; then
            fail "tunnel runner skipped: built without test-util"
          fi
          count() { sed -nE "s|.*$1.*|\1|p" "$log" | tail -1; }
          check() {
            [ -n "$2" ] || fail "$1: no count line in the log"
            [ "$2" -ge "$3" ] || fail "$1: $2 below floor $3"
            echo "$1: $2 (floor $3)"
          }
          check tunnel "$(count 'tunnel ([0-9]+)/[0-9]+')" 36
          check bridging "$(count 'bridging ([0-9]+)/[0-9]+')" 13
          check envelope "$(count 'envelope ([0-9]+) \(')" 63
          check envelope-asserted "$(count 'envelope [0-9]+ \(([0-9]+) asserted')" 49
          check status-text-entries "$(count 'status-text table entries: ([0-9]+)')" 102
          check status-text-cases "$(count 'status-text cases: ([0-9]+)')" 26
          grep -qF 'status-text rules: checked' "$log" || fail "status-text rules did not run"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcpwarp-fixtures
          path: build/mcpwarp-fixtures.log
          if-no-files-found: warn
