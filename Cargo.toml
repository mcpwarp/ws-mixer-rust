[workspace]
members = [".", "conformance/adapter"]
default-members = ["."]
resolver = "3"

[package]
name = "ws-mixer"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Rust client SDK for the ws-mixer.v1 protocol: N byte streams multiplexed over one WebSocket"
license = "Apache-2.0"
repository = "https://github.com/mcpwarp/ws-mixer-rust"
readme = "README.md"
keywords = ["websocket", "multiplexing", "tunnel", "tokio", "mcp"]
categories = ["network-programming", "asynchronous"]
exclude = ["/.github", "/conformance", "/.spec", "/.goserver", "/build", "Makefile", "*.pin", "BRIEF.md", ".mcp.json", "/.claude"]

[lib]
name = "ws_mixer"

[features]
default = ["rustls-platform-verifier", "ring"]
# Internal, not for users: the rustls stack, enabled by every feature below
# except native-tls. Needs a crypto provider (ring or aws-lc-rs).
__rustls = ["dep:rustls", "dep:tokio-rustls"]
rustls-platform-verifier = ["__rustls", "dep:rustls-platform-verifier"]
rustls-webpki-roots = ["__rustls", "dep:webpki-roots"]
native-tls = ["dep:tokio-native-tls"]
# rustls crypto provider. aws-lc-rs takes precedence when both are enabled.
ring = ["__rustls", "rustls/ring"]
aws-lc-rs = ["__rustls", "rustls/aws-lc-rs"]
conformance = []
# Constructors for event payloads and an in-memory Stream, for testing code
# that consumes this crate.
test-util = []

[dependencies]
bytes = "1"
fastrand = "2"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
http = "1"
httpdate = "1"
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"], optional = true }
rustls-platform-verifier = { version = "0.7", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros"] }
tokio-native-tls = { version = "0.3", optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12"], optional = true }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
tokio-util = "0.7"
tracing = "0.1"
webpki-roots = { version = "1", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "test-util"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(docsrs)"] }
